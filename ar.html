<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Choco Market - AR con Marcador</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- aframe-extras: necesario para animation-mixer (reproducir animaciones de GLB) -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.5.0/dist/aframe-extras.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* ===== Pantalla de carga ===== */
    .loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a0a00 0%, #3d1a00 50%, #1a0a00 100%);
      color: #fff;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loader-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 180, 100, 0.2);
      border-top-color: #ff9940;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 1.1rem;
      font-weight: 500;
      color: #ffb864;
      text-align: center;
      line-height: 1.6;
    }

    .loader-text small {
      display: block;
      font-size: 0.8rem;
      color: rgba(255, 184, 100, 0.6);
      margin-top: 8px;
    }

    /* ===== HUD / Interfaz superpuesta ===== */
    .ar-hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      pointer-events: none;
    }

    .ar-hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    }

    .ar-hud-title {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    .ar-hud-back {
      pointer-events: all;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s;
    }

    .ar-hud-back:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .ar-hud-back svg {
      width: 16px;
      height: 16px;
    }

    /* ===== Panel de instrucciones ===== */
    .ar-instructions {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 20px;
      pointer-events: none;
    }

    .ar-instructions-card {
      max-width: 400px;
      margin: 0 auto;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      text-align: center;
      color: #fff;
      animation: slideUp 0.5s ease forwards;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .ar-instructions-card.detected {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .ar-instructions-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .ar-instructions-text {
      font-size: 0.9rem;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.9);
    }

    .ar-instructions-text strong {
      color: #ff9940;
    }

    /* ===== Selector de modelo ===== */
    .model-selector {
      position: fixed;
      bottom: 100px;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
    }

    .model-btn {
      pointer-events: all;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .model-btn:hover {
      background: rgba(255, 153, 64, 0.3);
      border-color: #ff9940;
    }

    .model-btn.active {
      background: rgba(255, 153, 64, 0.4);
      border-color: #ff9940;
      color: #ffcc88;
      box-shadow: 0 0 20px rgba(255, 153, 64, 0.3);
    }

    /* ===== Indicador de estado ===== */
    .status-indicator {
      position: fixed;
      top: 70px;
      right: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4444;
      animation: pulse 1.5s ease infinite;
    }

    .status-indicator.tracking .status-dot {
      background: #44ff44;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>

<body>
  <!-- Pantalla de carga -->
  <div class="loader-overlay" id="loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">
      Cargando experiencia AR...
      <small>Asegúrate de permitir el acceso a la cámara</small>
    </div>
  </div>

  <!-- HUD Superior -->
  <div class="ar-hud">
    <div class="ar-hud-top">
      <a href="./index.html" class="ar-hud-back" id="btn-back">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Volver
      </a>
      <span class="ar-hud-title">Choco Market AR</span>
    </div>
  </div>

  <!-- Indicador de tracking -->
  <div class="status-indicator" id="status-indicator">
    <span class="status-dot"></span>
    <span id="status-text">Buscando marcador...</span>
  </div>

  <!-- Selector de modelos -->
  <div class="model-selector" id="model-selector">
    <button class="model-btn active" data-model="doom-animated" id="btn-doom-animated" onclick="switchModel('doom-animated')">
      🔥 Doom Animado
    </button>
    <button class="model-btn" data-model="doom-180" id="btn-doom-180" onclick="switchModel('doom-180')">
      💀 Doom 180°
    </button>
  </div>

  <!-- Instrucciones -->
  <div class="ar-instructions">
    <div class="ar-instructions-card" id="instructions-card">
      <div class="ar-instructions-icon">📷</div>
      <div class="ar-instructions-text">
        Apunta tu cámara al <strong>marcador HIRO</strong> para ver el modelo 3D animado.
        <br>
        <small style="opacity: 0.6; font-size: 0.75rem; margin-top: 4px; display: inline-block;">
          Puedes imprimir el marcador o mostrarlo en otra pantalla
        </small>
      </div>
    </div>
  </div>

  <!--
    ============================================================
    ESCENA AR.js + A-Frame
    ============================================================
    - arjs: configura la fuente de cámara y deshabilita el debug UI
    - embedded: permite que la escena coexista con HTML normal
    - vr-mode-ui: deshabilitado (no necesitamos VR)
    - renderer: logarithmicDepthBuffer evita z-fighting
    
    NOTA SOBRE MARCADORES:
    =====================
    Actualmente usamos el marcador "hiro" (preset) porque es el más
    estable y probado. Para usar tu marcador personalizado de cacao:
    
    1. Ve a: https://jeromeetienne.github.io/AR.js/three.js/examples/marker-training/examples/generator.html
    2. Sube la imagen del marcador (choco-marker.jpg de la carpeta markers/)
    3. Descarga el archivo .patt
    4. Colócalo en public/markers/choco-marker.patt
    5. Cambia <a-marker preset="hiro"> por:
       <a-marker type="pattern" url="./markers/choco-marker.patt">
  -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    loading-screen="enabled: false">

    <!-- Precargar los modelos GLB -->
    <a-assets timeout="60000">
      <a-asset-item id="doom-animated-model" src="./models/doomAnimated.glb"></a-asset-item>
      <a-asset-item id="doom-180-model" src="./models/doomAnimado180.glb"></a-asset-item>
    </a-assets>

    <!--
      Marcador HIRO (predeterminado).
      Para usar marcador personalizado, ver instrucciones arriba.
    -->
    <a-marker preset="hiro" id="ar-marker" emitevents="true">
      <!--
        Modelo: Doom Animado
        - animation-mixer: reproduce todas las animaciones del GLB en loop
        - scale: ajusta según el tamaño real de tu modelo (puede necesitar ajuste)
        - rotation: -90 en X porque los modelos GLB suelen estar orientados en Z-up
      -->
      <a-entity
        id="model-doom-animated"
        gltf-model="#doom-animated-model"
        animation-mixer="clip: *; loop: repeat; timeScale: 1;"
        scale="0.05 0.05 0.05"
        position="0 0 0"
        rotation="-90 0 0"
        visible="true">
      </a-entity>

      <a-entity
        id="model-doom-180"
        gltf-model="#doom-180-model"
        animation-mixer="clip: *; loop: repeat; timeScale: 1;"
        scale="0.05 0.05 0.05"
        position="0 0 0"
        rotation="-90 0 0"
        visible="false">
      </a-entity>
    </a-marker>

    <!-- Cámara -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // ============================================================
    // Estado de la aplicación
    // ============================================================
    let currentModel = 'doom-animated';
    let markerVisible = false;

    // ============================================================
    // Referencias DOM
    // ============================================================
    const loader = document.getElementById('loader');
    const statusIndicator = document.getElementById('status-indicator');
    const statusText = document.getElementById('status-text');
    const instructionsCard = document.getElementById('instructions-card');
    const marker = document.getElementById('ar-marker');

    // ============================================================
    // Ocultar pantalla de carga cuando la escena esté lista
    // ============================================================
    const scene = document.querySelector('a-scene');

    scene.addEventListener('loaded', () => {
      // Pequeño delay para que la cámara tenga tiempo de iniciar
      setTimeout(() => {
        loader.classList.add('hidden');
      }, 1500);
    });

    // Fallback: ocultar loader después de 8 segundos pase lo que pase
    setTimeout(() => {
      loader.classList.add('hidden');
    }, 8000);

    // ============================================================
    // Eventos del marcador: detectar cuando se encuentra/pierde
    // ============================================================
    marker.addEventListener('markerFound', () => {
      markerVisible = true;
      statusIndicator.classList.add('tracking');
      statusText.textContent = '¡Marcador detectado!';
      instructionsCard.classList.add('detected');
    });

    marker.addEventListener('markerLost', () => {
      markerVisible = false;
      statusIndicator.classList.remove('tracking');
      statusText.textContent = 'Buscando marcador...';
      instructionsCard.classList.remove('detected');
    });

    // ============================================================
    // Cambiar modelo activo
    // ============================================================
    function switchModel(modelName) {
      currentModel = modelName;

      // Actualizar visibilidad de los modelos
      const doomAnimated = document.getElementById('model-doom-animated');
      const doom180 = document.getElementById('model-doom-180');

      doomAnimated.setAttribute('visible', modelName === 'doom-animated');
      doom180.setAttribute('visible', modelName === 'doom-180');

      // Actualizar botones
      document.querySelectorAll('.model-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.model === modelName);
      });
    }
  </script>
</body>

</html>

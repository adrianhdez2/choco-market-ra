<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Engine</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- aframe-extras (animaciones de modelos GLB) -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.5.0/dist/aframe-extras.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background: transparent;
    }
  </style>
</head>

<body>
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    loading-screen="enabled: false">

    <!-- Precargar modelos -->
    <a-assets timeout="60000">
      <a-asset-item id="doom-animated-model" src="/models/doom/DoomVivo.glb"></a-asset-item>
    </a-assets>

    <!-- Marcador Choco Market Personalizado (.patt) en el SUELO -->
    <a-marker
      type="pattern"
      url="/markers/pattern-choco-marker.patt"
      id="marker-choco"
      emitevents="true">
      <!--
        rotation="0 0 0": El modelo se proyecta de pie perpendicular al marcador en el suelo.
        position="0 0 0": La base del modelo apoya directamente sobre el marcador.
      -->
      <a-entity
        id="model-doom-animated"
        gltf-model="#doom-animated-model"
        animation-mixer="clip: *; loop: repeat; timeScale: 1;"
        scale="3 3 3"
        position="0 0 0"
        rotation="0 0 0"
        visible="true">
      </a-entity>

      
    </a-marker>

    <!-- Cámara -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const markerChoco = document.getElementById('marker-choco');

    function notifyParent(type, payload = {}) {
      if (window.parent) {
        window.parent.postMessage({ type, ...payload }, '*');
      }
    }

    scene.addEventListener('loaded', () => {
      notifyParent('AR_SCENE_LOADED');
    });

    if (markerChoco) {
      markerChoco.addEventListener('markerFound', () => {
        notifyParent('AR_MARKER_FOUND', { marker: 'Choco Market' });
      });

      markerChoco.addEventListener('markerLost', () => {
        notifyParent('AR_MARKER_LOST');
      });
    }

    // Escuchar mensajes desde React
    window.addEventListener('message', (event) => {
      if (!event.data || typeof event.data !== 'object') return;

      if (event.data.type === 'SWITCH_MODEL') {
        const modelName = event.data.model;
        const animatedEl = document.getElementById('model-doom-animated');
        const doom180El = document.getElementById('model-doom-180');

        if (animatedEl) animatedEl.setAttribute('visible', modelName === 'doom-animated');
      } else if (event.data.type === 'SET_SCALE') {
        const s = event.data.scale;
        const scaleStr = `${s} ${s} ${s}`;
        const animatedEl = document.getElementById('model-doom-animated');

        if (animatedEl) animatedEl.setAttribute('scale', scaleStr);
      }
    });
  </script>
</body>

</html>
